<!-- Path: src/app/core/components/navbar/navbar.component.html -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3 mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold text-uppercase tracking-wider" routerLink="/">
      <i class="bi bi-mortarboard-fill me-2 text-primary"></i>EduEnroll
    </a>

    <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
      data-bs-target="#navContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navContent">
      <!-- Left side links: Will scale cleanly when more options are added -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link px-3" routerLink="/" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}">Dashboard</a>
        </li>
      </ul>

      <!-- Right side links: Contextual user tracking profiles -->
      <div class="d-flex align-items-lg-center flex-column flex-lg-row gap-3 ms-auto mt-2 mt-lg-0">
        @if (authService.isAuthenticated()) {
        <span
          class="text-light-50 small bg-secondary bg-opacity-25 px-3 py-1 border border-secondary border-opacity-50 rounded-pill">
          Logged in as: <strong class="text-info">{{ authService.currentUser()?.email }}</strong>
        </span>
        <button class="btn btn-sm btn-outline-danger rounded-pill px-4 shadow-sm" type="button" (click)="onLogout()">
          Logout
        </button>
        } @else {
        <a class="btn btn-sm btn-outline-light rounded-pill px-4" routerLink="/login">Sign In</a>
        <a class="btn btn-sm btn-primary text-white rounded-pill px-4 shadow-sm" routerLink="/register">Register</a>
        }
      </div>
    </div>
  </div>
</nav>
