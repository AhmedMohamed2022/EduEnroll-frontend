<!-- Path: src/app/features/auth/login.component.html -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="cf-auth-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="cf-icon-badge d-inline-flex align-items-center justify-content-center mb-3">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h3 class="cf-heading mb-1">Welcome Back</h3>
                    <p class="cf-subtext small">Please enter your details to sign in</p>
                </div>

                @if (errorMessage()) {
                <div class="alert alert-danger border-0 rounded-3 mb-3 p-3 d-flex align-items-center">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                    <span class="small fw-medium">{{ errorMessage() }}</span>
                </div>
                }

                <form (ngSubmit)="onLoginSubmit()">
                    <div class="mb-3">
                        <label class="cf-label">Email Address</label>
                        <input type="email" class="form-control cf-input" placeholder="name@university.com" name="email"
                            [(ngModel)]="credentials.email" required />
                    </div>

                    <div class="mb-4">
                        <label class="cf-label">Password</label>
                        <input type="password" class="form-control cf-input" placeholder="Type Your Password"
                            name="password" [(ngModel)]="credentials.password" required />
                    </div>

                    <button type="submit" class="btn cf-btn-primary w-100 mb-3">
                        Sign In <i class="bi bi-arrow-right ms-1"></i>
                    </button>

                    <p class="text-center small cf-subtext mb-0">
                        New to the portal? <a routerLink="/register" class="cf-link">Create an account</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
