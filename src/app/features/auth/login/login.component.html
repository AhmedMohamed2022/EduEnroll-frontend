<!-- Path: src/app/features/auth/login.component.html -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 p-4">
                <h3 class="text-center fw-bold text-primary mb-4">EduEnroll Sign In</h3>

                @if (errorMessage()) {
                <div class="alert alert-danger small shadow-sm mb-3">{{ errorMessage() }}</div>
                }

                <form (ngSubmit)="onLoginSubmit()">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" class="form-control" name="email" [(ngModel)]="credentials.email"
                            required />
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" class="form-control" name="password" [(ngModel)]="credentials.password"
                            required />
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill shadow-sm py-2 mb-3">Login</button>
                    <p class="text-center small text-muted mb-0">
                        Don't have an account? <a routerLink="/register" class="text-decoration-none">Register here</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
