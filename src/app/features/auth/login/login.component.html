<!-- Path: src/app/features/auth/login.component.html -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card card-premium shadow-sm border-0 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div
                        class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary p-3 rounded-circle mb-3">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
                    <p class="text-muted small">Please enter your details to sign in</p>
                </div>

                @if (errorMessage()) {
                <div class="alert alert-danger border-0 shadow-none d-flex align-items-center rounded-3 mb-3 p-3">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                    <span class="small fw-medium">{{ errorMessage() }}</span>
                </div>
                }

                <form (ngSubmit)="onLoginSubmit()">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Email Address</label>
                        <div class="position-relative">
                            <input type="email" class="form-control form-control-premium"
                                placeholder="name@university.com" name="email" [(ngModel)]="credentials.email"
                                required />
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-secondary">Password</label>
                        <input type="password" class="form-control form-control-premium" placeholder="••••••••"
                            name="password" [(ngModel)]="credentials.password" required />
                    </div>

                    <button type="submit" class="btn btn-primary btn-premium w-100 shadow-sm mb-3">
                        Sign In <i class="bi bi-arrow-right ms-1"></i>
                    </button>

                    <p class="text-center small text-muted mb-0">
                        New to the portal? <a routerLink="/register"
                            class="text-primary fw-medium text-decoration-none">Create an account</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
