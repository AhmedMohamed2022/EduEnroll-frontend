<!-- Path: src/app/features/auth/register.component.html -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="cf-auth-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="cf-icon-badge d-inline-flex align-items-center justify-content-center mb-3">
                        <i class="bi bi-person-plus-fill fs-3"></i>
                    </div>
                    <h3 class="cf-heading mb-1">Create Student Profile</h3>
                    <p class="cf-subtext small">Register to start enrolling in upcoming courses</p>
                </div>

                @if (errorMessage()) {
                <div class="alert alert-danger border-0 rounded-3 mb-3 p-3 d-flex align-items-center">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                    <span class="small fw-medium">{{ errorMessage() }}</span>
                </div>
                }

                <form (ngSubmit)="onRegisterSubmit()">
                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label class="cf-label">First Name</label>
                            <input type="text" class="form-control cf-input" placeholder="First Name" name="firstName"
                                [(ngModel)]="registrationData.firstName" required />
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="cf-label">Last Name</label>
                            <input type="text" class="form-control cf-input" placeholder="Last Name" name="lastName"
                                [(ngModel)]="registrationData.lastName" required />
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="cf-label">Email Address</label>
                        <input type="email" class="form-control cf-input" placeholder="FullName@university.com"
                            name="email" [(ngModel)]="registrationData.email" required />
                    </div>

                    <div class="mb-4">
                        <label class="cf-label">Password (min 6 characters)</label>
                        <input type="password" class="form-control cf-input" placeholder="Type Strong Password"
                            name="password" [(ngModel)]="registrationData.password" required />
                    </div>

                    <div class="mb-4">
                        <label class="cf-label d-block">Account Profile Type</label>
                        <div class="d-flex gap-3">
                            <div class="cf-role-option">
                                <input class="form-check-input" type="radio" name="userType" id="roleStudent"
                                    value="Student" [(ngModel)]="registrationData.userType" />
                                <label class="form-check-label small fw-medium" for="roleStudent">I am a Student</label>
                            </div>
                            <div class="cf-role-option">
                                <input class="form-check-input" type="radio" name="userType" id="roleInstructor"
                                    value="Instructor" [(ngModel)]="registrationData.userType" />
                                <label class="form-check-label small fw-medium" for="roleInstructor">I am an
                                    Instructor</label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn cf-btn-primary w-100 mb-3">
                        Register Account
                    </button>

                    <p class="text-center small cf-subtext mb-0">
                        Already registered? <a routerLink="/login" class="cf-link">Sign in instead</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
